<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>F1 Pedals</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="overlay" id="overlay">
      <section class="telemetry" aria-label="Live pedal inputs">
        <aside class="steering" id="steeringGauge" aria-label="Steering angle" hidden>
          <div class="steering-dial" id="steeringDial" role="meter" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="0">
            <div class="steering-marker" id="steeringMarker"></div>
            <output class="steering-value" id="steeringValue">0°</output>
          </div>
        </aside>

        <section class="history" aria-label="Pedal input history">
          <div class="chart-frame">
            <canvas id="historyCanvas" aria-label="Five second throttle and brake input graph"></canvas>
          </div>
        </section>

        <div class="pedals">
          <article class="pedal pedal--throttle">
            <div class="meter" role="meter" aria-label="Throttle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="meter-fill" id="throttleFill"></div>
            </div>
          </article>

          <article class="pedal pedal--brake">
            <div class="meter" role="meter" aria-label="Brake" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="meter-fill" id="brakeFill"></div>
            </div>
          </article>
        </div>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
