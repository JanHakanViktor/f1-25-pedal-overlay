<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 25 Pedal Overlay Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header>
        <p class="eyebrow">F1 25 Pedal Overlay</p>
        <h1>Settings</h1>
        <p>Changes are stored on this computer and applied when you save.</p>
      </header>

      <form id="settingsForm">
        <section>
          <h2>Overlay</h2>

          <label class="toggle-row">
            <span>
              <strong>Steering enabled by default</strong>
              <small>Show the steering circle whenever the application starts.</small>
            </span>
            <input id="steeringEnabledByDefault" type="checkbox" />
          </label>

          <label>
            <span class="label-line">
              <strong>Overlay transparency</strong>
              <output id="overlayTransparencyValue">30%</output>
            </span>
            <input id="overlayTransparency" type="range" min="20" max="100" step="1" />
          </label>

          <div class="field-grid">
            <label>
              <strong>UDP port</strong>
              <input id="udpPort" type="number" min="1" max="65535" step="1" required />
            </label>
            <label>
              <strong>Graph duration</strong>
              <span class="input-suffix">
                <input id="graphDurationSeconds" type="number" min="2" max="15" step="0.5" required />
                <span>seconds</span>
              </span>
            </label>
          </div>

          <label>
            <span class="label-line">
              <strong>Lock-up detection sensitivity</strong>
              <output id="lockupSensitivityValue">35%</output>
            </span>
            <input id="lockupSensitivity" type="range" min="15" max="90" step="1" />
            <small>Lower values trigger sooner; higher values require a stronger wheel lock.</small>
          </label>
        </section>

        <section>
          <h2>Lock-up colours</h2>
          <div class="choice-row">
            <label><input type="radio" name="lockupColorMode" value="axle" /> Separate axle colours</label>
            <label><input type="radio" name="lockupColorMode" value="single" /> One colour for every lock-up</label>
          </div>

          <div class="colour-grid" id="axleColours">
            <label><strong>Front</strong><input id="frontLockupColor" type="color" /></label>
            <label><strong>Rear</strong><input id="rearLockupColor" type="color" /></label>
            <label><strong>Both</strong><input id="bothLockupColor" type="color" /></label>
          </div>

          <div class="single-colour" id="singleColour">
            <label><strong>All lock-ups</strong><input id="singleLockupColor" type="color" /></label>
          </div>
        </section>

        <section>
          <h2>Shortcut keys</h2>
          <p class="section-help">Use Electron accelerator names, for example <code>Control+Shift+S</code>.</p>
          <div class="shortcut-grid">
            <label><strong>Show or hide overlay</strong><input id="toggleVisibilityShortcut" type="text" required /></label>
            <label><strong>Lock or unlock position</strong><input id="toggleLockShortcut" type="text" required /></label>
            <label><strong>Toggle demo signal</strong><input id="toggleDemoShortcut" type="text" required /></label>
            <label><strong>Enable steering</strong><input id="toggleSteeringShortcut" type="text" required /></label>
            <label><strong>Exit application</strong><input id="quitShortcut" type="text" required /></label>
          </div>
        </section>

        <footer>
          <output id="saveStatus" role="status" aria-live="polite"></output>
          <div class="actions">
            <button id="closeButton" type="button" class="secondary">Close</button>
            <button type="submit">Save settings</button>
          </div>
        </footer>
      </form>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
